# =============================================================
# LEDGER BACKEND - APPLICATION PROPERTIES
# TechWing | Spring Boot 3.2.x | Java 17
# =============================================================

# --------------------------------
# Server
# --------------------------------
server.port=8080
spring.application.name=ledger-backend

# --------------------------------
# MySQL RDS - AWS
# --------------------------------
spring.datasource.url=jdbc:mysql://ledgermatch-db.cpim6ccgscaw.ap-south-1.rds.amazonaws.com:3306/ledger?createDatabaseIfNotExist=true&useSSL=true&requireSSL=false&serverTimezone=Asia/Kolkata
spring.datasource.username=admin
spring.datasource.password=LedgerMatch#20
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection Pool (HikariCP)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=3
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=30000

# --------------------------------
# JPA / Hibernate
# --------------------------------
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# --------------------------------
# JWT Security
# --------------------------------
# Replace with a strong 256-bit Base64-encoded secret before deploying
jwt.secret=TGVkZ2VyTWF0Y2hTZWNyZXRLZXlUZWNoV2luZzIwMjZTZWN1cmU=
jwt.expiration=86400000

# --------------------------------
# File Upload (CSV)
# --------------------------------
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=25MB

# --------------------------------
# Python AI Service (Groq/FastAPI)
# --------------------------------
ai.service.url=http://localhost:8000
ai.service.reconcile-path=/ai/reconcile
ai.service.discrepancy-path=/ai/discrepancy-analysis
ai.service.report-summary-path=/ai/report-summary

# --------------------------------
# CORS
# --------------------------------
cors.allowed-origins=http://localhost:4200

# --------------------------------
# Logging
# --------------------------------
logging.level.com.techwing=DEBUG
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=DEBUG

# --------------------------------
# OpenAPI / Swagger UI
# --------------------------------
springdoc.api-docs.path=/api/docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
